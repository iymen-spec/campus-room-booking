services:
  postgres:
    image: postgres:17
    container_name: campus-room-booking-postgres
    environment:
      POSTGRES_DB: campus_room_booking
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
